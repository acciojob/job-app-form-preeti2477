<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=<form>, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<form method="get"><div id="form">
		<label for="name">Name</label>
		<input type="text" id="name" required><br><br>
		<label for="email">Email</label>
		<input type="email" id="email" required><br><br>
		<label>Gender</label>
		<input  type="radio" required id="male" name="gender" value="male">male
		<input type="radio" required id="female" value="female" name="gender">Female
		<input type="radio" required id="other" value="other" name="gender">Other<br><br>
		<label for="laptop">Laptop Brands</label>
		<select id="laptop">
			<option>Apple</option>
			<option>Asus</option>
			<option>HP</option>
		</select><br><br>
		<label for="age">Age</label>
		<input type="number" id="age" required><br><br>
		<label for="dob">Date of Birth</label>
		<input type="date" id="dob" required><br><br>
		<label for="password">Password</label>
		<input type="password" id="password" required><br><br>
		<label for="portfolio">Portfolio URl</label>
		<input type="url" id="portfolio" required><br><br>
		
		
		<!--<label for="submit">Submit  Button</label>-->
		<input type="button"  value=" Button"></div>
	</form>
</body>
</html>
